<body>
<!-- 10. Shopping Discount Input shopping amount. If amount is 1000 or more, display “Discount Available”; else display “No Discount”. -->

    <input type="text" placeholder="ammount" id="inp">
    
    <button onclick="demo()">click me</button>

    <script>
        
        var a = document.getElementById("inp")
  

        function demo() {

           
            var v = a.value;
    

            if (v>=1000) {
                alert("Discount available ");
            }
            else {
                alert("no discount");
            }

        }
    </script>

</body>
