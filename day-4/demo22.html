<!DOCTYPE html>
<html lang="en">
<head>
   
    <link rel="stylesheet" href="/css/bootstrap.css">
</head>
<body>
    <div class="conntainer">
        <div class="col-sm-6 shadow-lg mx-auto p-5">

        select tour couerse:
        <select onchange="demo()" class="form-control">
            <option value="" >--selet--</option>
            <option value="st0" >Summer training</option>
            <option value="st">apprinticeship</option>
            <option value="wt">winter training</option>
            <option value="st3" >Summer training3</option>
        
        </select>
        <br>

        registration fee:

        <input type="text" value="0" class="form-control" readonly>

        </div>
    </div>
    <script>

        function demo(){

            var ddl = document.querySelector("select")
            var text = document.querySelector("input")

            if(ddl.value=="st0"){
                text.value="1000"

            }
             if(ddl.value=="st"){
                text.value="4000"

            }
             
             if(ddl.value=="wt"){
                text.value="2000"

            }
             if(ddl.value=="st3"){
                text.value="3000"

            }
            if (ddl.value==""){
              
                text.value="0"
            }

        }
    </script>

    
</body>
</html>
