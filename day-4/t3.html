<body>

   <!-- 3. Adult or Minor Input age. If age is 18 or above, display “Adult”; else display “Minor”. -->

    <input type="text" placeholder="enter age" id="inp">
    <button onclick="demo()">click me</button>

    <script>
        var a = document.getElementById("inp");

        function demo() {

            var b = a.value;

            if (b > 18) {
                alert("you are adult");
            }
            else {
                alert("you are minor");
            }

        }
    </script>

</body>
