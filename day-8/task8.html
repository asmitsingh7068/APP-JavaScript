<!-- push() → 40 ko end me add 
unshift() → 5 ko start me add 
pop() → last element remove 
shift() → first element remove  -->


<html>


<head>


</head>

<body>   <button onclick="demo()">click me</button>
    
    <script>

        function demo(){
            var arr =  [10,20,30]


            arr.push(40)  // q1
            alert("//push "+arr)
            arr.unshift(5)//q2
            alert("//unshift "+arr)
            arr.pop()//q3
            alert("//pop :"+arr)
            arr.shift()
            alert("//shift :"+ arr)

        
        }


    </script>
</body>
</html>
