    <body>
        <!--24. Create a password input and button. On click, set '123456' as its value.
-->

       <b> password:</b> <input type="password" id="pass" placeholder=" enter password..">
       
       <button onclick="change()">
        change text
        </button>

        <script>

            document.getElementById("pass").value = "some text....";
            function change(){

               document.getElementById("pass").value = "123456"
                
            }
        </script>

    </body>
