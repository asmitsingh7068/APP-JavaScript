        <!-- 13. Take a name from an input box. Create a function showName() that gets the value and displays it using alert().-->

        <b>Name:</b> <input type="text" id="name" placeholder="enter name..">
         <button onclick="showName()">
        click me
        </button>

        <script>

             var a = document.getElementById("name")
            function showName(){
               
                alert("Name :"+a.value )
            }
        </script>
