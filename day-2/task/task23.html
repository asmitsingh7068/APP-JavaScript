    <body>
        <!--23. Create an input box and button. On button click, set 'student123' as the input value.
-->

       <b> input:</b> <input type="text" id="input" placeholder=" enter input..">
       
       <button onclick="change()">
        change text
        </button>

        <script>

            document.getElementById("input").value = "some text....";
            function change(){

               document.getElementById("input").value = "student123"
                
            }
        </script>

    </body>
