    <body>
        <!--25. Create an input box and button. On click, set 'Full Stack Development' as its value.
-->

       <b> input:</b> <input type="text" id="input" placeholder=" enter input..">
       
       <button onclick="change()">
        change text
        </button>

        <script>

            document.getElementById("input").value = "some text....";
            function change(){

               document.getElementById("input").value = "Full Stack Development"
                
            }
        </script>

    </body>
